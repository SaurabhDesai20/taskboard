[project]
name = "taskboard-backend"
version = "0.1.0"
description = "TaskBoard API: FastAPI monolith serving /api, /api/ws and the built React app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Required by FastAPI/Starlette TestClient (Starlette 1.x deprecates plain httpx).
    "httpx2>=2.16",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
# This is an application, not an installable library: uv only manages the venv.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "RUF"]
# PLAN.md names the domain exceptions NotFound, Forbidden, Conflict, ValidationFailed.
ignore = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations may import sa without using it and contain long lines.
"alembic/versions/*" = ["F401", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
